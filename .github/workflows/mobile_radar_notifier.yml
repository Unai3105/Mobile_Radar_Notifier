name: Mobile Radar Notifier

on:
  schedule:
    - cron: '50 5 * * *'  # 05:50 UTC = 06:50 en España (invierno) / 07:50 (verano)
    # Reintentos: salen sin hacer nada si hoy ya hubo una ejecución correcta (ver REINTENTO_DIFERIDO).
    # El de las 08:00 UTC es el último: si aún no se pudo comprobar, avisa a los usuarios.
    # Si cambias esta hora, cambia también la de ULTIMO_INTENTO más abajo.
    - cron: '20 6 * * *'
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  scraping_and_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write  # para el paso keepalive
    
    steps:
    - name: Check out the code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Paso 1: Ejecutar el script de sincronización de interacciones de Telegram a MongoDB
    - name: Run Telegram to MongoDB sync script
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        MONGO_URI: ${{ secrets.MONGO_URI }}
        MONGO_DB: ${{ secrets.MONGO_DB }}
        MONGO_COLLECTION_INTERACTIONS: ${{ secrets.MONGO_COLLECTION_INTERACTIONS }}
      run: |
        python bot_interactions_updater.py

    # Paso 2: Ejecutar el script de scraping y envío de mensajes
    - name: Run Scraping & Sending messages script
      env:
        DONOSTI_RADAR_WEB: ${{ secrets.DONOSTI_RADAR_WEB }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        MONGO_URI: ${{ secrets.MONGO_URI }}
        MONGO_DB: ${{ secrets.MONGO_DB }}
        MONGO_COLLECTION_INTERACTIONS: ${{ secrets.MONGO_COLLECTION_INTERACTIONS }}
        MONGO_COLLECTION_REPORTS: ${{ secrets.MONGO_COLLECTION_REPORTS }}
        ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        EVIDENCIAS_DIR: evidencias  # HTML y captura de la web si falla (se suben como artefacto)
        # Solo en las ejecuciones programadas distintas de la principal (no en las manuales)
        REINTENTO_DIFERIDO: ${{ github.event_name == 'schedule' && github.event.schedule != '50 5 * * *' && '1' || '' }}
        ULTIMO_INTENTO: ${{ github.event_name == 'schedule' && github.event.schedule == '0 8 * * *' && '1' || '' }}
      run: |
        python telegram_radar_notifier.py

    # Evidencias del fallo (HTML con la URL secreta redactada; sin captura de pantalla): solo existen si el scraping falló
    - name: Subir evidencias del fallo
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: evidencias-fallo
        path: evidencias/
        if-no-files-found: ignore
        retention-days: 30

    # Paso 3: Mantener activo el cron (GitHub lo desactiva tras 60 días sin actividad en el repo)
    - name: Keepalive del workflow programado
      if: always()
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api -X PUT "repos/${{ github.repository }}/actions/workflows/mobile_radar_notifier.yml/enable"
